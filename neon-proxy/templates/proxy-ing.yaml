{{- if or (.Values.ingress.enabled) (eq (.Values.ingress.enabled | toString) "") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Namespace }}-ing3
  annotations:
    {{- if .Values.ingress.cert_manager_cluster_issuer_annotation }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.cert_manager_cluster_issuer_annotation }}
    {{- end }}
    app.kubernetes.io/name: {{ .Values.ingress.className }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    nginx.ingress.kubernetes.io/rewrite-target: /solana/$1
    nginx.ingress.kubernetes.io/upstream-hash-by: $remote_addr
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    {{- if .Values.ingress.whitelistSourceRange }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ .Values.ingress.whitelistSourceRange }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
        - backend:
            service:
              name: {{ .Values.service.name }}
              port:
                number: {{ .Values.service.port }}
          path: /(sol|neon|usdc|usdt)/?$
          pathType: ImplementationSpecific
        - backend:
            service:
              name: {{ .Values.service.name }}
              port:
                number: {{ .Values.service.port }}
          path: /
          pathType: ImplementationSpecific
    {{- if .Values.ingress.host }}
    host: {{ .Values.ingress.host }}
    {{- end }}
{{- if .Values.ingress.tls }}
  tls:
    - hosts:
      - {{ .Values.ingress.host }}
      secretName: ssl-{{ .Values.ingress.host }}
{{- end }}
{{- end }}
