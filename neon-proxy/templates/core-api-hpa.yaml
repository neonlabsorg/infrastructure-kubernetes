{{- if .Values.coreapi.enabled }}
{{- if .Values.coreapi.hpa.enabled }}
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: core-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neon-proxy.labels" . | nindent 4 }}
spec:
  maxReplicas: {{ mul .Values.coreapi.replicas 2 }}
  minReplicas: {{ .Values.coreapi.replicas }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-api
  targetCPUUtilizationPercentage: {{ .Values.coreapi.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
