proxyCount: 1
keysPerProxy: 2

onePod:
  enabled: true

ingress:
  enabled: true
  className: "nginx"
  host: ""
  whitelistSourceRange: ""
  cert_manager_cluster_issuer_annotation: ""
  tls: false

image:
  repository: neonlabsorg/neon-proxy.py
  pullPolicy: Always
  tag: "v0.11.2"

neonRpcImage:
  repository: neonlabsorg/evm_loader
  pullPolicy: Always
  tag: "v1.21.0"

resources:
  requests:
    cpu: 500m
    memory: 2G        
  limits:
    cpu: 1000m            
    memory: 4G

serviceAccount:
  create: true
  annotations: {}
  name: "neon-proxy-sa"

securityContext:
  seccompProfile:
    type: RuntimeDefault
  privileged: false
  allowPrivilegeEscalation: false
  #runAsUser: 2000

podAnnotations: {}

service:
  name: proxy-svc
  type: ClusterIP
  sessionAffinity: None
  clusterIP: None
  port: 9090
  protocol: TCP
  labels: {}

extraPorts:
  - port: 9092
    containerPort: 9092
    protocol: TCP
    name: service-port
  - port: 8888
    containerPort: 8888
    protocol: TCP
    name: exporter

envFrom:
  - secretRef: 
      name: postgres-secret
  - secretRef: 
      name: proxy-config

ENABLE_SEND_TX_API: "YES"

proxyEnv: {}

solanaUrl: ""
solanaWsUrl: ""
neon_evm_program: ""
ppsolanaUrl: ""
minimal_gas_price: ""

volumes: 
  - name: proxy-keys-script
    configMap:
      name: proxy-keys-script
      defaultMode: 0777

volumeMounts: 
  - name: proxy-keys-script
    mountPath: /root/.config/solana/scripts/get_keys.sh
    subPath: get_keys.sh
  - name: proxy-keys-script
    mountPath: /opt/neon-proxy/proxy/run-proxy.sh
    subPath: run-proxy.sh
  - name: proxy-keys-script
    mountPath: /opt/neon-proxy/indexer/run-indexer.sh
    subPath: run-indexer.sh
  - name: proxy-keys-script
    mountPath: /opt/neon-proxy/core-api/run-core-api.sh
    subPath: run-core-api.sh
  #- name: proxy-keys-script
  #  mountPath: /opt/run-gas-tank.sh
  #  subPath: run-gas-tank.sh

livenessProbe:
  enabled: true
  httpGet: false
readinessProbe:
  enabled: true
  httpGet: false

workingDir: "/opt"

indexer:
  enabled: true
  service:
    name: indexer-svc
    type: ClusterIP
    port: 8888
    protocol: TCP
#  indexerKey: ""
  labels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

coreapi:
  enabled: false
  replicas: 2
  addr: "core-api-svc"
  port: "9500"
  service:
    name: core-api-svc
    type: ClusterIP
    port: 9500
    protocol: TCP
  tracer_db:
    type: "none"
    clickhouse_urls: ""
  labels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  hpa:
    enabled: false
    targetCPUUtilizationPercentage: 60
  logVerbosity: "warn" # One of: off | error | warn | info | debug
  COMMITMENT: "processed"


gasTank:
  enabled: false
