{{- if .Values.corerpc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: core-rpc-config
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  SOLANA_URL: {{ .Values.solanaUrl | b64enc | quote }}
  SOLANA_WS_URL: {{ .Values.solanaWsUrl | b64enc | quote }}
  PP_SOLANA_URL: {{ .Values.ppsolanaUrl | b64enc | quote }}
  EVM_LOADER: {{ .Values.neon_evm_program | b64enc | quote }}
{{- end }}
